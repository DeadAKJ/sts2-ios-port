name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  UseSharedCompilation: false
  DOTNET_CLI_DO_NOT_USE_GLOBAL_BUILD_SERVERS: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET iOS Workload
        run: |
          sudo dotnet workload install ios

      - name: Compile iOS Native Stubs
        run: |
          chmod +x stubs/build_stubs_ios.sh
          ./stubs/build_stubs_ios.sh

      - name: Build STS2iOS Assembly
        run: |
          dotnet build godot/STS2iOS.csproj -c Release

      - name: Download Godot 4.5.2 iOS Template
        run: |
          mkdir -p /tmp/templates_unzipped build/ios
          TEMPLATES_URL="https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_export_templates.tpz"

          echo "Downloading Godot 4.5.2 export templates..."
          curl -L -f -o templates.tpz "$TEMPLATES_URL"
          unzip -q templates.tpz -d /tmp/templates_unzipped
          
          # Extract the official iOS Xcode project template directly
          if [ -f "/tmp/templates_unzipped/templates/ios.zip" ]; then
            echo "Extracting official Godot iOS Xcode project template..."
            unzip -q /tmp/templates_unzipped/templates/ios.zip -d build/ios/
          else
            echo "ios.zip not found, searching templates..."
            find /tmp/templates_unzipped -name "*ios*"
          fi
          
          ls -la build/ios

      - name: Build Xcode Project with xcodebuild
        run: |
          cd build/ios
          XCODEPROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          echo "Found Xcode project: $XCODEPROJ"
          
          if [ -n "$XCODEPROJ" ]; then
            SCHEME=$(xcodebuild -list -project "$XCODEPROJ" | grep -A 1 "Schemes:" | tail -n 1 | tr -d ' ')
            if [ -z "$SCHEME" ]; then SCHEME="godot_ios"; fi
            echo "Building scheme: $SCHEME"
            
            xcodebuild \
              -project "$XCODEPROJ" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath SlayTheSpire2.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" || true
          fi
          cd ../..

      - name: Package IPA
        run: |
          mkdir -p Payload/SlayTheSpire2.app
          APP_DIR="Payload/SlayTheSpire2.app"
          
          # 1. Copy compiled .app contents if available
          ARCHIVED_APP=$(find build/ios -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -n "$ARCHIVED_APP" ] && [ -d "$ARCHIVED_APP" ]; then
            echo "Copying compiled app from $ARCHIVED_APP..."
            cp -R "$ARCHIVED_APP/"* "$APP_DIR/"
          fi
          
          # 2. Always install verified Info.plist
          echo "Installing Info.plist..."
          cp godot/Info.plist "$APP_DIR/Info.plist"
          
          # 3. Copy iOS native stubs
          mkdir -p "$APP_DIR/Frameworks"
          cp stubs/out/ios-arm64/*.dylib "$APP_DIR/Frameworks/" 2>/dev/null || true
          cp stubs/out/ios-arm64/*.dylib "$APP_DIR/" 2>/dev/null || true
          
          # 4. Copy managed game assemblies
          mkdir -p "$APP_DIR/assemblies"
          cp lib/*.dll "$APP_DIR/assemblies/" 2>/dev/null || true
          cp godot/bin/Release/net9.0/*.dll "$APP_DIR/assemblies/" 2>/dev/null || true
          cp lib/*.dll "$APP_DIR/" 2>/dev/null || true
          cp godot/bin/Release/net9.0/*.dll "$APP_DIR/" 2>/dev/null || true
          
          # 5. Copy executable binary if missing
          if [ ! -f "$APP_DIR/SlayTheSpire2" ]; then
            TEMPLATE_BIN=$(find build/ios /tmp/templates_unzipped -name "*template*release*arm64*" -o -name "*godot_ios*" 2>/dev/null | grep -v "\.a$" | grep -v "\.zip$" | head -n 1)
            if [ -n "$TEMPLATE_BIN" ] && [ -f "$TEMPLATE_BIN" ]; then
              echo "Installing engine binary from $TEMPLATE_BIN..."
              cp "$TEMPLATE_BIN" "$APP_DIR/SlayTheSpire2"
              chmod +x "$APP_DIR/SlayTheSpire2"
            fi
          fi
          
          # 6. Reassemble PCK parts if present
          if [ -d "pck_parts" ] && ls pck_parts/SlayTheSpire2.pck.part_* 1> /dev/null 2>&1; then
            echo "Reassembling SlayTheSpire2.pck from parts..."
            cat pck_parts/SlayTheSpire2.pck.part_* > "$APP_DIR/SlayTheSpire2.pck"
            echo "Embedded SlayTheSpire2.pck into IPA bundle!"
          fi
          
          # 7. Copy App Icon
          cp godot/icon.png "$APP_DIR/AppIcon.png" 2>/dev/null || true
          cp godot/icon.png "$APP_DIR/AppIcon60x60@2x.png" 2>/dev/null || true
          
          # 8. Package into final IPA
          zip -qr SlayTheSpire2-iOS.ipa Payload
          echo "IPA packaged successfully:"
          ls -lh SlayTheSpire2-iOS.ipa
          
          # Verify Info.plist inside IPA
          unzip -l SlayTheSpire2-iOS.ipa | grep Info.plist

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlayTheSpire2-iOS-ipa
          path: SlayTheSpire2-iOS.ipa
          if-no-files-found: error
