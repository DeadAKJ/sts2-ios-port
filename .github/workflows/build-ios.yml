name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET iOS Workload
        run: |
          sudo dotnet workload install ios

      - name: Compile iOS Native Stubs
        run: |
          chmod +x stubs/build_stubs_ios.sh
          ./stubs/build_stubs_ios.sh

      - name: Build STS2iOS Assembly
        run: |
          dotnet build godot/STS2iOS.csproj -c Release

      - name: Download Godot 4.5.2 & iOS Export Templates
        run: |
          mkdir -p ~/godot_bin
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_macos.universal.zip"
          TEMPLATES_URL="https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz"

          echo "Downloading Godot 4.5.2 Standard..."
          curl -L -f -o godot.zip "$GODOT_URL"
          unzip -q godot.zip -d ~/godot_bin/
          
          GODOT_EXE=$(find ~/godot_bin -name "Godot" -type f -perm +111 | head -n 1)
          echo "Godot binary located at: $GODOT_EXE"
          sudo cp "$GODOT_EXE" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/4.5.2.stable"
          mkdir -p "$TEMPLATES_DIR"
          echo "Downloading Godot 4.5.2 export templates..."
          curl -L -f -o templates.tpz "$TEMPLATES_URL"
          unzip -q templates.tpz -d /tmp/templates_unzipped
          cp -r /tmp/templates_unzipped/templates/* "$TEMPLATES_DIR/"
          echo "Export templates installed to $TEMPLATES_DIR:"
          ls -la "$TEMPLATES_DIR"

      - name: Export iOS Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --path godot --export-release "iOS" build/ios/SlayTheSpire2.xcodeproj
          ls -la build/ios

      - name: Build Xcode Project with xcodebuild
        run: |
          cd build/ios
          XCODEPROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          echo "Found Xcode project: $XCODEPROJ"
          
          if [ -n "$XCODEPROJ" ]; then
            SCHEME=$(xcodebuild -list -project "$XCODEPROJ" | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag' | head -n 1 | tr -d ' ')
            if [ -z "$SCHEME" ]; then SCHEME="godot_ios"; fi
            echo "Building scheme: $SCHEME"
            
            xcodebuild \
              -project "$XCODEPROJ" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath SlayTheSpire2.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi
          cd ../..

      - name: Package IPA
        run: |
          mkdir -p Payload/SlayTheSpire2.app
          APP_DIR="Payload/SlayTheSpire2.app"
          
          # 1. Copy compiled .app contents from Xcode archive
          ARCHIVED_APP=$(find build/ios/SlayTheSpire2.xcarchive -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$ARCHIVED_APP" ]; then
            ARCHIVED_APP=$(find build/ios -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          if [ -n "$ARCHIVED_APP" ] && [ -d "$ARCHIVED_APP" ]; then
            echo "Copying compiled app from $ARCHIVED_APP..."
            cp -R "$ARCHIVED_APP/"* "$APP_DIR/"
          else
            echo "ERROR: Compiled app not found in build/ios!"
            exit 1
          fi
          
          # 2. Ensure executable exists and matches CFBundleExecutable
          EXEC_NAME="SlayTheSpire2"
          if [ ! -f "$APP_DIR/$EXEC_NAME" ]; then
            EXISTING_BIN=$(find "$APP_DIR" -maxdepth 1 -type f -perm +111 | grep -v "\.dylib$" | grep -v "\.dll$" | head -n 1)
            if [ -n "$EXISTING_BIN" ]; then
              echo "Renaming/copying $EXISTING_BIN to $APP_DIR/$EXEC_NAME..."
              cp "$EXISTING_BIN" "$APP_DIR/$EXEC_NAME"
            fi
          fi
          chmod +x "$APP_DIR/$EXEC_NAME"
          
          # 3. Install verified Info.plist
          echo "Installing Info.plist..."
          cp godot/Info.plist "$APP_DIR/Info.plist"
          
          # 4. Copy iOS native stubs
          mkdir -p "$APP_DIR/Frameworks"
          cp stubs/out/ios-arm64/*.dylib "$APP_DIR/Frameworks/" 2>/dev/null || true
          cp stubs/out/ios-arm64/*.dylib "$APP_DIR/" 2>/dev/null || true
          
          # 5. Copy managed game assemblies
          mkdir -p "$APP_DIR/assemblies"
          cp lib/*.dll "$APP_DIR/assemblies/" 2>/dev/null || true
          cp godot/bin/Release/net9.0/*.dll "$APP_DIR/assemblies/" 2>/dev/null || true
          cp lib/*.dll "$APP_DIR/" 2>/dev/null || true
          cp godot/bin/Release/net9.0/*.dll "$APP_DIR/" 2>/dev/null || true
          
          # 6. Reassemble PCK parts if present
          if [ -d "pck_parts" ] && ls pck_parts/SlayTheSpire2.pck.part_* 1> /dev/null 2>&1; then
            echo "Reassembling SlayTheSpire2.pck from parts..."
            cat pck_parts/SlayTheSpire2.pck.part_* > "$APP_DIR/SlayTheSpire2.pck"
            echo "Embedded SlayTheSpire2.pck into IPA bundle!"
          fi
          
          # 7. Copy App Icon
          cp godot/icon.png "$APP_DIR/AppIcon.png" 2>/dev/null || true
          cp godot/icon.png "$APP_DIR/AppIcon60x60@2x.png" 2>/dev/null || true
          
          # 8. Package into final IPA
          zip -qr SlayTheSpire2-iOS.ipa Payload
          echo "IPA packaged successfully:"
          ls -lh SlayTheSpire2-iOS.ipa
          
          # 9. Verify bundle integrity
          echo "Verifying IPA contents:"
          unzip -l SlayTheSpire2-iOS.ipa | grep -E "SlayTheSpire2$|Info.plist"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlayTheSpire2-iOS-ipa
          path: SlayTheSpire2-iOS.ipa
          if-no-files-found: error
