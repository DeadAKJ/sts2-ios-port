name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET iOS Workload
        run: |
          sudo dotnet workload install ios

      - name: Compile iOS Native Stubs
        run: |
          chmod +x stubs/build_stubs_ios.sh
          ./stubs/build_stubs_ios.sh

      - name: Download Godot 4.5.2 Mono & iOS Export Templates
        run: |
          mkdir -p ~/godot_bin
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_macos.universal.zip"
          TEMPLATES_URL="https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_export_templates.tpz"

          echo "Downloading Godot 4.5.2 Mono..."
          curl -L -f -o godot.zip "$GODOT_URL"
          unzip -q godot.zip -d ~/godot_bin/
          
          APP_BUNDLE=$(find ~/godot_bin -name "*.app" -type d | head -n 1)
          echo "Found app bundle: $APP_BUNDLE"
          sudo cp -R "$APP_BUNDLE" /Applications/Godot.app
          
          # Use a wrapper script instead of a symlink to prevent GodotSharp path resolution hang
          echo '#!/bin/bash' > /tmp/godot
          echo 'exec /Applications/Godot.app/Contents/MacOS/Godot "$@"' >> /tmp/godot
          chmod +x /tmp/godot
          sudo mv /tmp/godot /usr/local/bin/godot
          /usr/local/bin/godot --version
          
          # Register local Godot .NET SDK NuGet package source
          dotnet nuget add source /Applications/Godot.app/Contents/Resources/GodotSharp/Tools/nupkgs/ --name GodotLocal || true
          
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/4.5.2.stable.mono"
          mkdir -p "$TEMPLATES_DIR"
          echo "Downloading Godot 4.5.2 Mono export templates..."
          curl -L -f -o templates.tpz "$TEMPLATES_URL"
          unzip -q templates.tpz -d /tmp/templates_unzipped
          cp -r /tmp/templates_unzipped/templates/* "$TEMPLATES_DIR/"
          echo "Export templates installed to $TEMPLATES_DIR:"
          ls -la "$TEMPLATES_DIR"

      - name: Setup Spine GDExtension for iOS
        run: |
          mkdir -p /tmp/spine_ext
          SPINE_URL="https://spine-godot.s3.eu-central-1.amazonaws.com/4.2/4.5.1-stable/spine-godot-extension-4.2-4.5.1-stable.zip"
          echo "Downloading Spine GDExtension from $SPINE_URL..."
          curl -L -f -o /tmp/spine_ext/spine.zip "$SPINE_URL"
          unzip -q /tmp/spine_ext/spine.zip -d /tmp/spine_ext
          mkdir -p godot/addons/spine
          cp -R /tmp/spine_ext/bin/* godot/addons/spine/
          echo "Installed Spine GDExtension to godot/addons/spine:"
          ls -la godot/addons/spine

      - name: Setup FMOD GDExtension for iOS
        run: |
          mkdir -p /tmp/fmod_ext
          FMOD_URL="https://github.com/utopia-rise/fmod-gdextension/releases/download/6.1.0-4.5.0/addons.zip"
          echo "Downloading FMOD GDExtension from $FMOD_URL..."
          curl -L -f -o /tmp/fmod_ext/fmod.zip "$FMOD_URL"
          unzip -q /tmp/fmod_ext/fmod.zip -d /tmp/fmod_ext
          mkdir -p godot/addons/fmod
          cp -R /tmp/fmod_ext/fmod/* godot/addons/fmod/
          if [ -d "godot/addons/fmod/libs/iOS" ] && [ ! -d "godot/addons/fmod/libs/ios" ]; then
            cp -R godot/addons/fmod/libs/iOS godot/addons/fmod/libs/ios
          fi
          echo "Installed FMOD GDExtension to godot/addons/fmod:"
          ls -la godot/addons/fmod
          ls -la godot/addons/fmod/libs/ios

      - name: Build STS2iOS Assembly
        run: |
          mkdir -p godot/lib
          cp -R lib/* godot/lib/
          dotnet build godot/STS2iOS.csproj -c Release

      - name: Export iOS Xcode Project
        env:
          DOTNET_CLI_DO_NOT_USE_GLOBAL_BUILD_SERVERS: 1
          UseSharedCompilation: false
        run: |
          mkdir -p build/ios godot/build/ios
          ROOT_DIR="$(pwd)"
          cd godot
          /Applications/Godot.app/Contents/MacOS/Godot --headless --verbose --export-release "iOS" "$ROOT_DIR/build/ios/SlayTheSpire2.xcodeproj" || {
            echo "ERROR: Godot iOS export failed! Printing MSBuild logs:"
            find "$HOME/Library/Application Support/Godot/mono/build_logs" -name "msbuild_log.txt" -exec cat {} + 2>/dev/null || true
            exit 1
          }
          cd ..
          
          if [ -d "godot/build/ios/SlayTheSpire2.xcodeproj" ]; then
            cp -R godot/build/ios/* build/ios/
          fi
          ls -la build/ios

      - name: Build Xcode Project with xcodebuild
        run: |
          cd build/ios
          XCODEPROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          echo "Found Xcode project: $XCODEPROJ"

          # Inject load_all_fmod_plugins definition into Xcode project source files
          echo "Injecting load_all_fmod_plugins definition into Xcode project..."
          find . -type f \( -name "*.mm" -o -name "*.m" -o -name "*.cpp" \) | while read -r src; do
            if grep -q "UIApplicationMain" "$src" 2>/dev/null || grep -q "main(" "$src" 2>/dev/null; then
              echo "Injecting load_all_fmod_plugins into $src..."
              printf '\n#ifdef __cplusplus\nextern "C" {\n#endif\n__attribute__((visibility("default"))) __attribute__((used))\nuint32_t* load_all_fmod_plugins(void* p_interface, uint32_t* r_count) {\n    if (r_count) { *r_count = 0; }\n    return 0;\n}\n#ifdef __cplusplus\n}\n#endif\n' >> "$src"
            fi
          done
          
          if [ -n "$XCODEPROJ" ]; then
            SCHEME=$(xcodebuild -list -project "$XCODEPROJ" | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag' | head -n 1 | tr -d ' ')
            if [ -z "$SCHEME" ]; then SCHEME="godot_ios"; fi
            echo "Building scheme: $SCHEME"
            
            xcodebuild \
              -project "$XCODEPROJ" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath SlayTheSpire2.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM=""
          fi
          cd ../..

      - name: Package IPA
        run: |
          mkdir -p Payload/SlayTheSpire2.app
          APP_DIR="Payload/SlayTheSpire2.app"
          
          # 1. Copy compiled .app contents from Xcode archive
          ARCHIVED_APP=$(find build/ios/SlayTheSpire2.xcarchive -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$ARCHIVED_APP" ]; then
            ARCHIVED_APP=$(find build/ios -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          if [ -n "$ARCHIVED_APP" ] && [ -d "$ARCHIVED_APP" ]; then
            echo "Copying compiled app from $ARCHIVED_APP..."
            cp -R "$ARCHIVED_APP/"* "$APP_DIR/"
          else
            echo "ERROR: Compiled app not found in build/ios!"
            exit 1
          fi
          
          # 2. Ensure executable exists and matches CFBundleExecutable
          EXEC_NAME="SlayTheSpire2"
          if [ ! -f "$APP_DIR/$EXEC_NAME" ]; then
            EXISTING_BIN=$(find "$APP_DIR" -maxdepth 1 -type f -perm +111 | grep -v "\.dylib$" | grep -v "\.dll$" | head -n 1)
            if [ -n "$EXISTING_BIN" ]; then
              echo "Renaming/copying $EXISTING_BIN to $APP_DIR/$EXEC_NAME..."
              cp "$EXISTING_BIN" "$APP_DIR/$EXEC_NAME"
            fi
          fi
          chmod +x "$APP_DIR/$EXEC_NAME"
          
          # 3. Install verified Info.plist
          echo "Installing Info.plist..."
          cp godot/Info.plist "$APP_DIR/Info.plist"
          
          # 4. Copy iOS native stubs
          mkdir -p "$APP_DIR/Frameworks"
          cp stubs/out/ios-arm64/*.dylib "$APP_DIR/Frameworks/" 2>/dev/null || true
          cp stubs/out/ios-arm64/*.dylib "$APP_DIR/" 2>/dev/null || true
          cp "$APP_DIR/Frameworks/libsteam_api.dylib" "$APP_DIR/Frameworks/libsteam_api64.dylib" 2>/dev/null || true
          cp "$APP_DIR/libsteam_api.dylib" "$APP_DIR/libsteam_api64.dylib" 2>/dev/null || true

          # 4b. Embed Spine GDExtension Framework
          if [ -d "godot/addons/spine/ios/libspine_godot.ios.template_release.framework" ]; then
            echo "Embedding Spine framework into $APP_DIR/Frameworks/..."
            cp -R godot/addons/spine/ios/libspine_godot.ios.template_release.framework "$APP_DIR/Frameworks/"
          fi
          mkdir -p "$APP_DIR/addons/spine/ios"
          cp godot/addons/spine/spine_godot_extension.gdextension "$APP_DIR/addons/spine/" 2>/dev/null || true
          cp -R godot/addons/spine/ios/* "$APP_DIR/addons/spine/ios/" 2>/dev/null || true

          # 4c. Embed FMOD GDExtension scripts into bundle
          echo "Embedding FMOD scripts into $APP_DIR/addons/fmod/..."
          mkdir -p "$APP_DIR/addons/fmod"
          cp godot/addons/fmod/fmod.gdextension "$APP_DIR/addons/fmod/" 2>/dev/null || true
          cp godot/addons/fmod/FmodManager.gd "$APP_DIR/addons/fmod/" 2>/dev/null || true
          cp -R godot/addons/fmod/icons "$APP_DIR/addons/fmod/" 2>/dev/null || true

          # 5. Copy managed game assemblies
          mkdir -p "$APP_DIR/assemblies"
          cp lib/*.dll "$APP_DIR/assemblies/" 2>/dev/null || true
          cp godot/bin/Release/net9.0/*.dll "$APP_DIR/assemblies/" 2>/dev/null || true
          cp lib/*.dll "$APP_DIR/" 2>/dev/null || true
          cp godot/bin/Release/net9.0/*.dll "$APP_DIR/" 2>/dev/null || true
          
          # 6. Reassemble PCK parts if present
          if [ -d "pck_parts" ] && ls pck_parts/SlayTheSpire2.pck.part_* 1> /dev/null 2>&1; then
            echo "Reassembling SlayTheSpire2.pck from parts..."
            cat pck_parts/SlayTheSpire2.pck.part_* > "$APP_DIR/SlayTheSpire2.pck"
            echo "Embedded SlayTheSpire2.pck into IPA bundle!"
          fi
          
          # 7. Copy App Icon
          cp godot/icon.png "$APP_DIR/AppIcon.png" 2>/dev/null || true
          cp godot/icon.png "$APP_DIR/AppIcon60x60@2x.png" 2>/dev/null || true
          
          # 8. Package into final IPA
          zip -qr SlayTheSpire2-iOS.ipa Payload
          echo "IPA packaged successfully:"
          ls -lh SlayTheSpire2-iOS.ipa
          
          # 9. Verify bundle integrity
          echo "Verifying IPA contents:"
          unzip -l SlayTheSpire2-iOS.ipa | grep -E "SlayTheSpire2$|Info.plist"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlayTheSpire2-iOS-ipa
          path: SlayTheSpire2-iOS.ipa
          if-no-files-found: error
